name: Compliance record policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable record tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify deterministic index, schemas, and local links
        run: python3 scripts/check_compliance.py

      - name: Enforce append-only compliance history
        if: github.event_name == 'pull_request'
        env:
          FETCHII_POLICY_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_compliance.py --append-only-base "$FETCHII_POLICY_BASE"

      - name: Run complete compliance policy unit suite
        run: python3 -m unittest discover -s tests -v
